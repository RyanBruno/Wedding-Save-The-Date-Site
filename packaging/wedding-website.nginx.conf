# Wedding website: static pages from the package.
#
# Installed to /etc/nginx/conf.d/wedding-website.conf. It needs
# `include conf.d/*.conf;` inside the http block of /etc/nginx/nginx.conf.
#
# ── What the CDN in front of this is told ────────────────────────────────────
#
# A CDN is a pull cache: it fetches from this machine and keeps whatever these
# headers permit. Nothing is uploaded anywhere, so this file is the entire
# cache policy and the only place it is written down.
#
# There are two kinds of path here.
#
#   fingerprinted    cached for a year and never revalidated. Everything under
#                    /pkg/ carries a content hash in its filename and
#                    /landing.js carries one in its query string, so a new
#                    build is a new URL and a stale copy is unreachable rather
#                    than wrong. Photographs count too: a replaced photograph
#                    goes up under a new filename.
#   HTML             cached at the edge for a few minutes, never in the
#                    browser. This is the only thing a deploy changes at a URL
#                    that already existed, so it is the only thing with a TTL
#                    short enough to notice.
#
# Because the assets are fingerprinted, no deploy needs a cache purge: the HTML
# ages out on its own and already names the new files when it does.
#
# Every location repeats `include .../wedding-website.headers.conf` — see that
# file for the nginx inheritance rule that makes it necessary.

# Everything on port 80 is redirected, so the site is only ever served over TLS.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # The one exception to the redirect: certbot answers Let's Encrypt's HTTP-01
    # challenge out of this directory, and that check is made over plain HTTP.
    #   certbot certonly --webroot -w /var/lib/letsencrypt -d <host>
    #
    # no-store because a cached challenge response outlives the challenge and
    # fails the next renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    # Machine-specific certificate paths live in a separate, package-preserved
    # file. The package can replace this site's routing and cache policy without
    # requiring a .pacnew merge after every change.
    include /etc/nginx/wedding-website-tls.conf;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /usr/share/webapps/wedding-website;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length   1024;

    # ── Fingerprinted: cached for a year, never revalidated ──────────────────

    # cargo-leptos names these website.<hash>.js, .wasm and .css (hash-files in
    # the workspace Cargo.toml), and the prerendered HTML links to them by that
    # name. A build that changed one of them changed its URL.
    location /pkg/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/wedding-website.headers.conf;
    }

    # Copied verbatim out of assets-dir, so unlike /pkg/ its filename is fixed.
    # The hash is in the query string instead: the shell renders
    # /landing.js?v=<hash of the file>. See LANDING_JS_VERSION in
    # src/frontend/src/app.rs.
    location = /landing.js {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/wedding-website.headers.conf;
    }

    # Photographs and fonts. Not hashed, but the filenames are the camera's own
    # identifiers and are never reused: a replaced photograph is a new file
    # under a new name. Overwrite one in place and the year starts applying to
    # the wrong bytes.
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/wedding-website.headers.conf;
    }

    # ── HTML: edge for ten minutes, browser never ────────────────────────────

    # max-age=0 so a guest who reloads always gets the current page, s-maxage so
    # the CDN still absorbs the traffic. Ten minutes is how long a deploy takes
    # to become visible; there is nothing else to wait for, because the assets
    # the new HTML names are already at URLs no cache has ever seen.
    #
    # try_files ends in =404, NOT /index.html. Falling back to the home page
    # answers every unknown path — every scanner, every typo, every mistyped
    # asset — with 200 and a copy of the landing page, which the CDN then
    # stores under each of those URLs. That fills the cache with junk keys, and
    # an asset URL that 404s during a bad deploy gets a year-long immutable
    # entry containing HTML.
    location / {
        try_files  $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=600, must-revalidate" always;
        include    /etc/nginx/wedding-website.headers.conf;
    }

    # ── Not found ────────────────────────────────────────────────────────────

    error_page 404 /404.html;

    # The prerendered /404 route (see src/frontend/src/app.rs). `internal` keeps
    # it from being fetched directly as a 200; a request for /404.html is itself
    # a 404 and lands back here with the right status.
    #
    # A minute at the edge, so a mistake during a deploy does not persist, but
    # a crawler working through a list of guessed paths still only reaches this
    # machine once per path per minute.
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
        include    /etc/nginx/wedding-website.headers.conf;
    }

    # try_files above would otherwise serve 404.html at this path with a 200,
    # which is a soft 404: a crawler indexes it and a cache keeps it.
    location = /404 {
        return 404;
    }
}
