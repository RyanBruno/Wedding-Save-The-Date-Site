# Response headers every location sends, included from
# /etc/nginx/conf.d/wedding-website.conf.
#
# This is a separate file because of one nginx rule: add_header directives are
# inherited from the enclosing block ONLY IF the current block declares none of
# its own. Every location in the main config sets Cache-Control, so every one of
# them would silently lose the security headers declared beside the server's
# root. Including this file is how each location gets them back.
#
# Installed to /etc/nginx/wedding-website.headers.conf. Not a backup= file:
# there is nothing here worth editing per machine, and an upgrade should be able
# to change these.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;

# Leave HSTS off while the certificate is self-signed: it would stop a browser
# from offering the click-through that makes the site reachable. Turn it on with
# the real certificate.
#add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
